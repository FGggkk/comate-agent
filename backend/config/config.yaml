app:
  name: comate-agent
  debug: true

database:
  url: "${DATABASE_URL}"

email:
  host: "smtp.qq.com"
  port: 465
  user: "${EMAIL_USER}"
  pass: "${EMAIL_PASS}"
  from: "伴行agent <${EMAIL_USER}>"

cos:
  secret_id: "${COS_SECRET_ID}"
  secret_key: "${COS_SECRET_KEY}"
  region: "${COS_REGION}"
  bucket: "${COS_BUCKET}"

embedding:
  api_key: "${DASHSCOPE_API_KEY}"
  workspace_id: "${DASHSCOPE_WORKSPACE_ID}"
  model: "${EMBEDDING_MODEL}"
  dimensions: 1536

model:
  default:
    provider: deepseek
    model: "deepseek-chat"
    api_key: "${DEEPSEEK_API_KEY}"
    base_url: "https://api.deepseek.com"
    stream: true

jwt:
  secret: "${JWT_SECRET}"
  algorithm: HS256
  expire_hours: 72
