version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: comate-postgres
    environment:
      POSTGRES_USER: comate
      POSTGRES_PASSWORD: comate_dev
      POSTGRES_DB: comate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comate"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
