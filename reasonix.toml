[permissions]
allow = ["Bash(uv --version 2>/dev/null || echo \"uv 未安装\")", "Bash(node --version && npm --version)", "Bash(cd backend && pip list 2>/dev/null | head -20 || echo \"pip 不在 venv 中\")", "Bash(python -c:*)", "Bash(cd backend && uv run uvicorn app.main:app --reload --port 8000 --host 0.0.0.0)", "Bash(sleep 8 && echo \"---后端启动检查---\")", "Bash(cd frontend && npm run dev)", "Bash(sleep 5 && echo \"前端启动检查完成\")", "Bash(# 1. 健康检查\necho \"===== 1. 健康检查 =====\"\ncurl -s http://localhost:8000/api/health | python -m json.tool\n\n# 2. 注册用户（测试）\necho -e \"\\n===== 2. 注册用户 =====\"\ncurl -s -X POST http://localhost:8000/api/auth/register \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"email\":\"test@test.com\",\"password\":\"test123\",\"code\":\"\",\"nickname\":\"测试用户\"}' \\\n  | python -m json.tool 2>&1 || curl -s -X POST http://localhost:8000/api/auth/register \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"email\":\"test@test.com\",\"password\":\"test123\",\"code\":\"\",\"nickname\":\"测试用户\"}'\n\n# 3. 登录\necho -e \"\\n===== 3. 登录 =====\"\ncurl -s -X POST http://localhost:8000/api/auth/login \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"email\":\"test@test.com\",\"password\":\"test123\"}' \\\n  | python -m json.tool 2>&1)", "Bash(# 先拿到 token\nTOKEN=\"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI5ODI2NGE2OS01MjlkLTRiMmMtYTE4Yi1lOTFlZDU1OGU3OWUiLCJlbWFpbCI6InRlc3RAdGVzdC5jb20iLCJleHAiOjE3ODU0NjEyOTJ9.2DiJ9sQu1bv8iDiaXnc-POO8x_qXCt4WlnoGl_doERQ\"\n\n# 查看用户信息\necho \"===== 1. 用户信息 =====\"\ncurl -s http://localhost:8000/api/user/me -H \"Authorization: Bearer $TOKEN\" | python -m json.tool\n\n# 获取 SOUL 模板列表\necho -e \"\\n===== 2. SOUL 模板 =====\"\ncurl -s http://localhost:8000/api/souls/templates -H \"Authorization: Bearer $TOKEN\" | python -m json.tool 2>&1 | head -30\n\n# 获取用户的 SOUL 列表\necho -e \"\\n===== 3. 用户 SOUL =====\"\ncurl -s http://localhost:8000/api/souls/ -H \"Authorization: Bearer $TOKEN\" | python -m json.tool 2>&1 | head -30\n\n# 获取会话列表\necho -e \"\\n===== 4. 会话列表 =====\"\ncurl -s http://localhost:8000/api/sessions/ -H \"Authorization: Bearer $TOKEN\" | python -m json.tool 2>&1 | head -30\n\n# 记忆模块\necho -e \"\\n===== 5. 记忆列表 =====\"\ncurl -s http://localhost:8000/api/memories/ -H \"Authorization: Bearer $TOKEN\" | python -m json.tool 2>&1 | head -30\n\n# 面试场景\necho -e \"\\n===== 6. 面试会话 =====\"\ncurl -s http://localhost:8000/api/interview/ -H \"Authorization: Bearer $TOKEN\" | python -m json.tool 2>&1 | head -30)", "Bash(TOKEN=\"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI5ODI2NGE2OS01MjlkLTRiMmMtYTE4Yi1lOTFlZDU1OGU3OWUiLCJlbWFpbCI6InRlc3RAdGVzdC5jb20iLCJleHAiOjE3ODU0NjEyOTJ9.2DiJ9sQu1bv8iDiaXnc-POO8x_qXCt4WlnoGl_doERQ\"\n\n# 检查 /api/souls/ 路由\necho \"===== SOUL 路由(带斜杠) =====\"\ncurl -s -w \"\\nHTTP_CODE:%{http_code}\" http://localhost:8000/api/souls/ -H \"Authorization: Bearer $TOKEN\"\n\necho -e \"\\n===== SOUL 路由(不带斜杠) =====\"\ncurl -s -w \"\\nHTTP_CODE:%{http_code}\" http://localhost:8000/api/souls -H \"Authorization: Bearer $TOKEN\"\n\n# 检查 sessions\necho -e \"\\n===== Sessions =====\"\ncurl -s -w \"\\nHTTP_CODE:%{http_code}\" http://localhost:8000/api/sessions/ -H \"Authorization: Bearer $TOKEN\"\n\n# 检查 memory_items (不是 memories)\necho -e \"\\n===== 注册接口参数 =====\"\ncurl -s -X POST http://localhost:8000/api/auth/register \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"email\":\"test2@test.com\",\"password\":\"test123\",\"nickname\":\"新用户\"}' \\\n  | python -c \"import sys,json; d=json.load(sys.stdin); print(json.dumps(d,indent=2,ensure_ascii=False))\" 2>&1)", "Bash(# 查看 soul 路由的 endpoints\ncurl -s http://localhost:8000/openapi.json | python -c \"\nimport json, sys\nspec = json.load(sys.stdin)\nfor path, methods in spec.get('paths', {}).items():\n    if 'soul' in path.lower():\n        print(f'{path}: {list(methods.keys())}')\n\")", "Bash(TOKEN=\"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI5ODI2NGE2OS01MjlkLTRiMmMtYTE4Yi1lOTFlZDU1OGU3OWUiLCJlbWFpbCI6InRlc3RAdGVzdC5jb20iLCJleHAiOjE3ODU0NjEyOTJ9.2DiJ9sQu1bv8iDiaXnc-POO8x_qXCt4WlnoGl_doERQ\"\n\n# 查看所有 API 端点\necho \"======= 完整 API 端点 =======\"\ncurl -s http://localhost:8000/openapi.json | python -c \"\nimport json, sys\nspec = json.load(sys.stdin)\nfor path, methods in spec.get('paths', {}).items():\n    print(f'{path}: {list(methods.keys())}')\n\")", "Bash(TOKEN=\"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI5ODI2NGE2OS01MjlkLTRiMmMtYTE4Yi1lOTFlZDU1OGU3OWUiLCJlbWFpbCI6InRlc3RAdGVzdC5jb20iLCJleHAiOjE3ODU0NjEyOTJ9.2DiJ9sQu1bv8iDiaXnc-POO8x_qXCt4WlnoGl_doERQ\"\n\necho \"===== 1. SOUL 库存 =====\"\ncurl -s http://localhost:8000/api/souls/me/inventory -H \"Authorization: Bearer $TOKEN\" | python -c \"import sys,json; d=json.load(sys.stdin); print(json.dumps(d,indent=2,ensure_ascii=False))\" 2>&1\n\necho -e \"\\n===== 2. 记忆列表 =====\"\ncurl -s http://localhost:8000/api/memories -H \"Authorization: Bearer $TOKEN\" | python -c \"import sys,json; d=json.load(sys.stdin); print(json.dumps(d,indent=2,ensure_ascii=False))\" 2>&1\n\necho -e \"\\n===== 3. 创建会话 =====\"\ncurl -s -X POST http://localhost:8000/api/sessions -H \"Authorization: Bearer $TOKEN\" -H \"Content-Type: application/json\" -d '{\"title\":\"测试对话\"}' | python -c \"import sys,json; d=json.load(sys.stdin); print(json.dumps(d,indent=2,ensure_ascii=False))\" 2>&1\n\necho -e \"\\n===== 4. 提醒列表 =====\"\ncurl -s http://localhost:8000/api/reminders -H \"Authorization: Bearer $TOKEN\" | python -c \"import sys,json; d=json.load(sys.stdin); print(json.dumps(d,indent=2,ensure_ascii=False))\" 2>&1\n\necho -e \"\\n===== 5. 面试列表 =====\"\ncurl -s http://localhost:8000/api/interview -H \"Authorization: Bearer $TOKEN\" | python -c \"import sys,json; d=json.load(sys.stdin); print(json.dumps(d,indent=2,ensure_ascii=False))\" 2>&1\n\necho -e \"\\n===== 6. 禁区记忆 =====\"\ncurl -s -X POST http://localhost:8000/api/memories/forbidden -H \"Authorization: Bearer $TOKEN\" -H \"Content-Type: application/json\" -d '[]' | python -c \"import sys,json; d=json.load(sys.stdin); print(json.dumps(d,indent=2,ensure_ascii=False))\" 2>&1)"]
